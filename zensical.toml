[project]
site_name = "Screentime Solutions"
site_description = "A practical wiki for reclaiming attention on every device."
site_url = "https://noahweidig.com/screentime/"
copyright = "© 2026 Screentime Solutions · Verify each provider's current terms before relying on a tool."
extra_css = ["stylesheets/extra.css"]
repo_url = "https://noahweidig.com/screentime/#pick-your-device"
repo_name = "Pick your device"
nav = [
  {"Start here" = "index.md"},
  {"Basics" = "basics.md"},
  {"iPhone" = [
    {"Overview" = "iphone/index.md"},
    {"Password Locker" = "iphone/password-locker.md"},
    {"Foqos" = "iphone/foqos.md"},
    {"Shift Your Phone" = "iphone/shift-your-phone.md"},
    {"one sec" = "iphone/one-sec.md"},
    {"ScreenZen" = "iphone/screenzen.md"},
    {"Freedom" = "iphone/freedom.md"},
    {"Covenant Eyes" = "iphone/covenant-eyes.md"},
  ]},
  {"Android" = [
    {"Overview" = "android/index.md"},
    {"one sec" = "android/one-sec.md"},
    {"Freedom" = "android/freedom.md"},
    {"Covenant Eyes" = "android/covenant-eyes.md"},
  ]},
  {"iPad" = [
    {"Overview" = "ipad/index.md"},
    {"Foqos" = "ipad/foqos.md"},
    {"Freedom" = "ipad/freedom.md"},
    {"Covenant Eyes" = "ipad/covenant-eyes.md"},
  ]},
  {"Mac" = [
    {"Overview" = "mac/index.md"},
    {"Cold Turkey" = "mac/cold-turkey.md"},
    {"SelfControl" = "mac/selfcontrol.md"},
    {"Freedom" = "mac/freedom.md"},
    {"Covenant Eyes" = "mac/covenant-eyes.md"},
  ]},
  {"Windows" = [
    {"Overview" = "windows/index.md"},
    {"Cold Turkey" = "windows/cold-turkey.md"},
    {"Freedom" = "windows/freedom.md"},
    {"Covenant Eyes" = "windows/covenant-eyes.md"},
  ]},
  {"Resources" = [
    {"Glossary" = "resources/glossary.md"},
    {"Cheat sheet" = "resources/cheat-sheet.md"},
    {"How to choose" = "resources/how-to-choose.md"},
    {"Family setup" = "resources/family-setup.md"},
    {"Tool comparison" = "resources/comparison.md"},
    {"Accountability partners" = "resources/accountability.md"},
    {"Troubleshooting" = "resources/troubleshooting.md"},
    {"FAQ" = "resources/faq.md"},
  ]},
]

[project.theme]
favicon = "assets/favicon.svg"
logo = "assets/logo.svg"
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "navigation.path",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.tabs.sticky",
  "navigation.tracking",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.footnote.tooltips",
  "content.action.view",
  "content.tabs.link",
]

[project.theme.icon]
view = "lucide/eye"
repo = "lucide/arrow-right"
previous = "lucide/arrow-left"
next = "lucide/arrow-right"
top = "lucide/arrow-up"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"},
]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["includes"]
auto_append = ["glossary.md"]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.extra]
generator = false

[[project.extra.social]]
icon = "lucide/globe"
link = "https://noahweidig.com/screentime/"
name = "noahweidig.com/screentime"
